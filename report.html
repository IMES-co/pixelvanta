<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Infringement — PIXELVANTA</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="report.js"></script></head><body><header class="topbar"><a class="brand" href="index.html">© PIXELVANTA</a><a href="index.html">Home</a></header><main class="section"><span class="eyebrow">RIGHTS REPORTING</span><h1>Report alleged infringement</h1><p>Reports are queued for authorised human review. This form does not automatically issue legal notices or takedown requests.</p><form id="reportForm" class="form-grid"><label>Reporter name<input name="reporter_name" required></label><label>Email address<input name="email" type="email" required></label><label>Original copyright record URL<input name="record_url" type="url" required></label><label>Infringing website URL<input name="infringing_url" type="url" required></label><label class="full">Description of alleged infringement<textarea name="description" required rows="5"></textarea></label><label class="full">Evidence file (optional)<input type="file" name="evidence" accept=".pdf,.png,.jpg,.jpeg,.webp"></label><label class="check full"><input type="checkbox" required><span>I submit this report in good faith and believe the information is accurate.</span></label><label class="full">Electronic signature<input name="signature" required placeholder="Type your full legal name"></label><div class="full"><button class="btn btn-primary">Submit report for review</button><span id="reportStatus" class="status"></span></div></form></main><footer><div class="footer-bottom"><a href="index.html">PIXELVANTA</a> · Operated under IMES</div></footer></body></html>
